# =============================================================================
# Trino Catalog: postgres
# Connector: postgresql  (JDBC)
# Purpose: Query structured relational data stored in PostgreSQL
#
# Usage in Trino SQL:
#   SELECT * FROM postgres.public.users;
# =============================================================================

connector.name=postgresql

# JDBC connection to the 'postgres' Docker service on the internal network
connection-url=jdbc:postgresql://postgres:5432/appdb

# Credentials must match POSTGRES_USER / POSTGRES_PASSWORD in docker-compose.yml
connection-user=demo
connection-password=demo

# Map extra PostgreSQL types to VARCHAR for compatibility
jdbc-types-mapped-to-varchar=inet,cidr,macaddr,macaddr8
