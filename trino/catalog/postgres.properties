# postgresql connector via JDBC
connector.name=postgresql

# 'postgres' is the docker service name, resolves on the internal network
connection-url=jdbc:postgresql://postgres:5432/appdb

# must match POSTGRES_USER / POSTGRES_PASSWORD in docker-compose.yml
connection-user=demo
connection-password=demo

# map postgres-specific types to varchar so trino doesn't choke on them
jdbc-types-mapped-to-varchar=inet,cidr,macaddr,macaddr8
