# =============================================================================
# Trino Catalog: lake
# Connector: hive  (reads Parquet/ORC/Avro files from object storage)
# Purpose: Query lake-layer data stored as Parquet files on MinIO
#
# Usage in Trino SQL:
#   SELECT * FROM lake.analytics.user_events;
# =============================================================================

connector.name=hive

# --------------------------------------------------------------------------
# Hive Metastore
# --------------------------------------------------------------------------
hive.metastore.uri=thrift://hive-metastore:9083

# --------------------------------------------------------------------------
# MinIO / S3-compatible object storage
# --------------------------------------------------------------------------

# MinIO endpoint (Docker service name on the internal network)
hive.s3.endpoint=http://minio:9000

# Access credentials (match MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin

# REQUIRED for MinIO: use path-style URLs
hive.s3.path-style-access=true

# Disable SSL for local dev
hive.s3.ssl.enabled=false

# --------------------------------------------------------------------------
# Table format & storage defaults
# --------------------------------------------------------------------------
hive.storage-format=PARQUET
hive.allow-drop-table=true
parquet.use-column-names=true
